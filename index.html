<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="stylesheet" href="CSS/styles.css">
    <script src="JS/script.js" defer></script>
</head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Générateur d'annonces IT</title>


</head>

<body>
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <span class="logo-text" data-lang="applicationTitle">📢 Générateur d'annonces IT</span>
            </div>
            <label id="lblLanguage" data-lang="language">
                🌎 Langue
            </label>
            <select id="language">
                <option value="fr" data-lang="languageFR">Français</option>
                <option value="en" data-lang="languageEN">English</option>
            </select>
        </nav>
    </header>

    <div class="container">
        <div class="panel">
            <h2>⚙️ Configuration</h2>
            <label id="lblType" data-lang="type">
                Type
            </label>
            <select id="type">
                <option value="" selected>---</option>
                <option value="info" id="optInfo" data-lang="info">
                    📢 Information
                </option>
                <option value="maintenance" id="optMaintenance" data-lang="maintenance">
                    🔧 Maintenance
                </option>
                <option value="incident" id="optIncident" data-lang="incident">
                    🚨 Incident
                </option>
                <option value="alert" id="optAlert" data-lang="alert">
                    📣 Alert
                </option>
            </select>
            <label id="lblCompanyName" data-lang="companyName">
                Nom de compagnie
            </label>
            <input id="companyName" type="text">

            <label id="lbllocalisation" data-lang="localisation">
                Localisation
            </label>
            <input id="localisation" type="text">
            <div id="timeGroup">
                <label id="lblTime" data-lang="time">
                    Heure
                </label>
                <input type="time" id="time">
            </div>
            <div id="frenchGroup">
                <div class="section-title" data-lang="frenchSection">
                    🇫🇷 Français
                </div>
                <label id="lblTitle" data-lang="title">
                    Titre
                </label>
                <input id="title">
                <label id="lblDescription" data-lang="description">
                    Description
                </label>
                <textarea id="description"></textarea>
                <div id="servicesGroup">
                    <label id="lblServices" data-lang="services">
                        Services affectés
                    </label>
                    <textarea id="services"></textarea>
                </div>
                <div id="importantNoteGroup">
                    <label id="lblimportantNote" data-lang="importantNote">
                        Point d'attention
                    </label>
                    <textarea id="importantNote"></textarea>
                </div>

                <div id="itTeamMsgFRGroup">
                    <label id="lblITMsgFR" data-lang="itTeamMsgFR">
                        Message de l'équipe TI
                    </label>
                    <input id="itMsgFR" type="text">
                </div>

                <div id="emailFRGroup">
                    <label id="lblEmailAddressFR" data-lang="emailAddressFR">
                        Courriel
                    </label>
                    <input id="emailAddressFR" type="text">
                </div>

            </div>

            <div id="englishGroup">
                <div class="section-title" data-lang="englishSection">
                    🇬🇧 English
                </div>

                <label id="lblTitleEN" data-lang="titleEN">
                    Titre en anglais
                </label>
                <input id="titleEN">

                <label id="lblDescriptionEN" data-lang="descriptionEN">
                    Description en anglais
                </label>
                <textarea id="descriptionEN"></textarea>


                <div id="servicesENGroup">
                    <label id="lblServicesEN" data-lang="servicesEN">
                        Services affected
                    </label>
                    <textarea id="servicesEN"></textarea>
                </div>

                <div id="importantNoteENGroup">
                    <label id="lblimportantNoteEN" data-lang="importantNoteEN">
                        Important note
                    </label>
                    <textarea id="importantNoteEN"></textarea>
                </div>


                <div id="emailENGroup">
                    <label id="lblEmailAddressEN" data-lang="emailAddressEN">
                        Courriel
                    </label>
                    <input id="emailAddressEN" type="text">
                </div>

                <div id="itTeamMsgENGroup">
                    <label id="lblITMsgEN" data-lang="itTeamMsgEN">
                        Message de l'équipe TI
                    </label>
                    <input id="itMsgEN" type="text">
                </div>
            </div>


            <button id="copyBtn" onclick="copyToOutlook()" data-lang="copy">
                📋 Copier vers Outlook
            </button>

        </div>

        <div class="panel">

            <h2 id="previewTitle" data-lang="preview">
                👀 Aperçu en temps réel
            </h2>

            <div id="preview"></div>

            <div id="emailHtml" style="display:none"></div>

        </div>


    </div>


    <div id="toast" class="toast">

        <div class="toast-icon">✅</div>

        <div class="toast-content">

            <div class="toast-title">
                Succès
            </div>

            <div class="toast-message">
                Le contenu HTML a été copié dans le presse‑papiers.
            </div>

        </div>

        <button class="toast-close" onclick="hideToast()">
            ✕
        </button>

    </div>

    <div id="helpButton" onclick="toggleHelp()">
        ?
    </div>

    <div id="helpPopup">

        <div class="help-header" id="helpTitle">
            ℹ️ Guide rapide
        </div>

        <div class="help-content" id="helpContent">

            <ul>
                <li>Choisir le type d'annonce.</li>
                <li>Remplir les informations.</li>
                <li>Valider l'aperçu.</li>
                <li>Copier dans Outlook.</li>
            </ul>

        </div>

    </div>

</body>

</html>
